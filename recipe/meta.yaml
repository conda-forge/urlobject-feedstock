{% set name = "URLObject" %}
{% set version = "3.0.0" %}
{% set compress_type = "tar.gz" %}
{% set hash_val = "bfdfe70746d92a039a33e964959bb12cecd9807a434fdb7fef5f38e70a295818" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | lower }}-{{ version }}.tar.gz
  sha256: {{ hash_val }}

build:
  number: 0
  noarch: python
  script: "{{ PYTHON }} -m pip install . --no-deps --ignore-installed --no-cache-dir -vvv"

requirements:
  host:
    - python
    - pip

  run:
    - python

test:
  imports:
    - urlobject

about:
  home: https://github.com/zacharyvoase/urlobject
  license: PUBLIC-DOMAIN
  license_file: UNLICENSE
  summary: 'A utility class for manipulating URLs.'
  dev_url: https://github.com/zacharyvoase/urlobject
  doc_url: https://urlobject.readthedocs.io/

extra:
  recipe-maintainers:
    - pmlandwehr
